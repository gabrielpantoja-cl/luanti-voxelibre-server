# ===========================================
# CONFIGURACION SERVIDOR VALDIVIA 2.0
# ===========================================
# Mundo generado con Arnis desde OpenStreetMap
# Recreacion de Valdivia, Chile

# Informacion basica del servidor
server_name = Valdivia [Chile]
server_description = Valdivia, Chile recreada en voxels desde OpenStreetMap. Supervivencia educativa, explora la ciudad recreada de Chile.
# MOTD vacio a proposito: la bienvenida (una sola, en amarillo) la manda el mod
# valdivia_spawn_npc para no duplicar el saludo en el chat.
motd =
server_address = luanti.gabrielpantoja.cl
server_url = https://luanti.gabrielpantoja.cl/
world_name = valdivia
worldname = valdivia

# Anunciar en lista publica de Luanti
server_announce = true

# Configuracion de red
# bind_address = 0.0.0.0  # Comentado: usar default (::) para IPv4+IPv6, igual que Wetlands
port = 30001
max_users = 20
strict_protocol_version_checking = false

# Configuracion del juego - EXPLORACION (sin vuelo global, con daño)
creative_mode = false
enable_damage = true
enable_pvp = true
enable_fire = false
enable_tnt = false
enable_rollback_recording = false
keepInventory = true

# VoxeLibre: Modo creativo nativo
mcl_enable_creative_mode = true
mcl_creative_is_survival_like = false
give_initial_stuff = false
initial_stuff =

# Proteccion y moderacion
disallow_empty_password = false
secure.enable_security = true
# Solo wetlands_contact puede hacer HTTP (/gabo -> bot compartido y relay interno).
# El token NO va aqui: vive en worlds/valdivia/wetlands_contact.conf.
secure.http_mods = wetlands_contact
disable_escape_sequences = true

# Chat
default_language = es
chat_message_format = <@name> @message
chat_message_max_size = 500

# Rendimiento — ampliado para maqueta de ciudad explorable (singlenode, sin mobs)
# Valdivia es un mundo fijo pre-generado: no gasta CPU en mapgen ni mobs, asi que
# subimos los limites heredados de Wetlands para que se vea la ciudad de lejos.
dedicated_server_step = 0.09
active_object_send_range_blocks = 8        # era 4 — vehiculos/objetos visibles mas lejos
active_block_range = 4                      # era 3
max_block_send_distance = 20                # era 10 — TECHO de vision: 320 nodos (antes 160)
max_block_generate_distance = 20            # era 10 — alineado con send (singlenode no genera)
time_speed = 72
num_emerge_threads = 2
server_unload_unused_data_timeout = 600

# Mapgen: singlenode (mundo importado desde Arnis, no genera terreno nuevo)
default_game = mineclone2
mg_name = singlenode

# Spawn point (generado por Arnis v2.9.0 - Plaza de la República)
static_spawnpoint = 3669.5,-8.5,-3055.5
respawn_auto = true

# Configuracion de mobs - HABILITADOS para modo supervivencia
mobs_spawn = true
only_peaceful_mobs = false
mcl_difficulty = normal
mcl_doMobSpawning = true
# Nota: los monstruos hostiles aparecen durante la noche en modo supervivencia.
# Si los jugadores ven "Modo pacifico activo!" al entrar, ejecuta /gamerule
# doMobSpawning true y /difficulty normal dentro del juego (gabo) para
# anular cualquier guarda permanente en la base de datos del mundo (map_meta).

# Anti-grief: NINGUNA explosion destruye nodos (mundo sin proteccion de area).
# mcl_explosions.explode() respeta este flag globalmente -> cubre TNT, creeper,
# ghast, vagoneta TNT, cristal del End, camas, respawn anchor, wither.
# El mod valdivia_no_explosions ademas oculta esos items del creativo.
mcl_explosions_griefing = false

# Seguridad para ninos
enable_client_modding = false
csm_restriction_flags = 63
csm_restriction_noderange = 0
max_simultaneous_block_sends_per_client = 40   # era 6 — default Luanti; elimina el pop-in al volar
max_simultaneous_block_sends_server_total = 40
server_map_save_interval = 60

# Mensajes
kick_msg_crash_msgqueue = "Error de conexion - reconectate en un momento"
kick_msg_shutdown = "Servidor Valdivia en mantenimiento - vuelve pronto"

# Logs
debug_log_level = warning
log_level = warning

# Administrador
name = gabo
admin_name = gabo

# Privilegios para nuevos jugadores (supervivencia)
# Se quita 'creative' para que los jugadores usen inventario de supervivencia.
# El admin 'gabo' conserva todos los privilegios via admin_privs más abajo.
default_privs = interact,shout,fast,spawn,teleport

# ===========================================
# MODS HABILITADOS (minimos para exploracion)
# ===========================================
load_mod_wetlands_newplayer = false
load_mod_wetlands_lastpos = true
load_mod_valdivia_newplayer = true
load_mod_server_rules = true
load_mod_wetlands_mundos = false  # Valdivia es el punto publico de entrada
load_mod_valdivia_aliases = true  # aliases mcl_* → mesecons_* para nodos del mapa generado con Arnis
# /gabo permite pedir ayuda y recibir respuestas privadas desde el bot compartido.
load_mod_wetlands_contact = true

# Teletransportador de la ciudad (pedestal + comando /ir a 4 ubicaciones)
load_mod_valdivia_teleporter = false  # deshabilitado temporalmente — coordenadas desactualizadas post-Arnis

# Skins
load_mod__world_folder_media = true
load_mod_mcl_custom_world_skins = true

# WorldEdit (para enriquecimiento manual)
load_mod_worldedit = true
load_mod_worldedit_commands = true
load_mod_worldedit_shortcommands = true

# Vehiculos para explorar la ciudad
load_mod_automobiles_lib = true
load_mod_automobiles_vespa = true
load_mod_automobiles_beetle = true
load_mod_automobiles_motorcycle = true
load_mod_automobiles_buggy = true
load_mod_automobiles_trans_am = true
load_mod_automobiles_roadster = true
load_mod_automobiles_coupe = true
load_mod_automobiles_catrelle = true
load_mod_automobiles_delorean = true

# Musica de fondo de VoxeLibre (mcl_music, mod del juego: no se apaga con
# load_mod_*; el interruptor es mcl_game_music). valdivia_discoteca la
# silencia solo para quien esta dentro de la discoteca y la devuelve al salir.
mcl_game_music = true

# NPCs interactivos con dialogos tematicos de Valdivia (agricultor, historiador, etc.)
load_mod_wetlands_npcs = true
# wetlands_music: tracks de audio compartidos (necesarios para valdivia_discoteca)
load_mod_wetlands_music = true
# valdivia_music deshabilitado: musica aleatoria al explorar era demasiado intrusiva.
# La discoteca tiene su propia musica; afuera suena la de VoxeLibre (mcl_music).
load_mod_valdivia_music = false
# Discoteca interactiva: musica posicional + NPCs bailando + luces al entrar a la zona
load_mod_valdivia_discoteca = true
# Deshabilita el huevo de Zombie Piglin (jugadores porfiados lo sacaban del
# inventario creativo y llenaban la ciudad) + limpieza automatica cada 5 min
load_mod_valdivia_no_zombie_piglin = true
# NPC guia del spawn: da la bienvenida, muestra reglas, recuerda /gabo y
# teletransporta a lugares de la ciudad (/spawn_guia, /lugar_guardar, /lugares)
load_mod_valdivia_spawn_npc = true
# Aviso en pantalla (arriba a la izquierda) para los conectados: "<nombre> entrando..."
load_mod_valdivia_aviso_entrada = true
# Anti-grief: oculta items explosivos/incendiarios del creativo y deja el TNT
# inerte (complementa mcl_explosions_griefing=false mas abajo)
load_mod_valdivia_no_explosions = true

# Televisores animados para hogares y edificios de la ciudad
load_mod_voxelibre_tv = true

# Mods pesados DESHABILITADOS (no necesarios para exploracion)
load_mod_wetlands_christmas = false
load_mod_wetlands_no_creeper = false
load_mod_wetlands_fixlight = true
load_mod_pvp_arena = false
load_mod_chess = false
load_mod_celevator = false
load_mod_halloween_ghost = false
load_mod_halloween_zombies = false
load_mod_broom_racing = false
load_mod_auto_road_builder = false
# voxelibre_protection se mantiene: guarda el area spawn_plaza_chile (Plaza, del
# admin) con su excepcion para botones/puertas con la mano vacia.
load_mod_voxelibre_protection = false
voxelibre_protection_max_radius = 120
voxelibre_protection_default_height = 30
# Protector Redo (TenPlus1): los jugadores protegen sus construcciones con el
# bloque protector (clic derecho muestra el area y agrega miembros). Convive con
# voxelibre_protection (ambos encadenan is_protected). protector_spawn = 0: la
# Plaza ya la cubre spawn_plaza_chile.
load_mod_protector = true
protector_radius = 20
protector_spawn = 0
protector_hud_interval = 5
protector_show_interval = 20
load_mod_mcl_potions_hotfix = false
