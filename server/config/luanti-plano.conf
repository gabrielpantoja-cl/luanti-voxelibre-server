# ===========================================
# CONFIGURACION SERVIDOR PLANO 🟩
# ===========================================
# Cuarto mundo: Mineclonia sobre un mundo TOTALMENTE PLANO.
# Reemplaza al antiguo mundo CTF (capturetheflag de rubenwardy), retirado
# el 2026-09-13. El mapeo a puerto 30003 del host se define en docker-compose.yml.
#
# Experiencia buscada: un lienzo infinito para construir. Superficie de
# pasto perfectamente plana, tierra debajo y roca hasta el bedrock.
# Sin cuevas, sin arboles, sin lagos, sin colinas, sin mazmorras.

# Informacion basica del servidor
server_name = Plano 🟩 | Mundo Plano para Construir
server_description = Mundo Mineclonia perfectamente plano: pasto arriba, tierra y roca abajo. Sin cuevas ni arboles — un lienzo limpio para construir lo que imagines. Modo creativo sin dano.
motd = Bienvenid@ al mundo Plano! Todo es superficie lisa de pasto. Toma lo que quieras del inventario creativo y construye.
server_address = luanti.gabrielpantoja.cl
server_url = https://gabrielpantoja.cl
world_name = plano
worldname = plano

# No anunciar en lista publica (por ahora)
server_announce = false
server_keywords = creative,flat,superflat,mineclonia,sandbox,building,spanish

# Configuracion de red - el container escucha en 30000 internamente
bind_address = 0.0.0.0
port = 30000
max_users = 15
strict_protocol_version_checking = false

# ===========================================
# MODO CREATIVO SIN DAÑO
# ===========================================
creative_mode = true
enable_damage = false
enable_pvp = false
enable_fire = false
enable_tnt = false
enable_rollback_recording = false
keepInventory = true

# Game base — Mineclonia (fork de VoxeLibre, NO es VoxeLibre)
default_game = mineclonia
load_mod_wetlands_mundos = true

# ===========================================
# MAPGEN PLANO (CRITICO — leer antes de tocar)
# ===========================================
# NINGUNA semilla genera un mundo plano: esto es cuestion de mapgen, no de
# seed. Usamos el mapgen "flat" del motor + un unico bioma de pasto.
#
# ⚠️ Todos los ajustes mg_* se CONGELAN en server/worlds/plano/map_meta.txt
# al crear el mundo. Cambiarlos aca despues NO tiene efecto: hay que crear
# el mundo de cero (o editar map_meta.txt con el container apagado).
#
# Stack MEDIDO en un mundo generado con esta config (2026-09-13, local):
#   y =    8          mcl_core:dirt_with_grass   (1 capa de pasto, uniforme)
#   y =    7 .. 6     mcl_core:dirt              (2 nodos, uniforme)
#   y =    5 .. -62   mcl_core:stone
#   y =  -63 .. -123  mcl_deepslate:deepslate    (bioma "Plains_deep_underground")
#   y = -124 .. -128  mcl_core:bedrock           (mcl_mapgen_core)
#   y <= -129         mcl_core:void
# Superficie plana verificada en (0,0), (+-500,+-500), (2000,0), (0,2000) y
# (-3000,3000): 81/81 columnas con el suelo exactamente en y=8, sin una sola
# planta ni accidente de terreno.
mg_name = flat
mgflat_ground_level = 8
mgflat_spflags = nolakes,nohills

# mg_flags se aplica SOBRE los defaults (caves,dungeons,light,decorations,
# biomes,ores): lo que no se nombra conserva su valor por defecto (encendido).
# Verificado 2026-09-13 leyendo el map_meta.txt generado: listar solo
# "nocaves,nodungeons,nodecorations" dejaba "ores" encendido igual.
# Por eso hay que apagar explicitamente con el prefijo "no".
#   noores -> el pedido era "hacia abajo solo roca": sin vetas de carbon/hierro/
#             diamante y sin blobs de grava/diorita/granito en la piedra.
#             Para tener minerales, cambiar a "ores" ANTES de crear el mundo.
# "biomes" y "light" se dejan listados en positivo por claridad: sin "light" el
# mundo quedaria a oscuras y sin "biomes" no habria capa de pasto ni de tierra.
mg_flags = nocaves,nodungeons,nodecorations,noores,biomes,light

# ⚠️ IMPRESCINDIBLE para que el mundo quede realmente limpio.
# Mineclonia trae "ersatz": un generador Lua propio que en cualquier mapgen que
# NO sea singlenode se activa por defecto (mcl_levelgen_enable_ersatz = true) y
# siembra vegetacion y estructuras estilo Minecraft mediante
# core.register_on_generated — es decir, IGNORA el flag "nodecorations" del
# motor. Verificado 2026-09-13: con ersatz activo salian pasto alto, amapolas y
# tulipanes sobre la superficie plana.
mcl_levelgen_enable_ersatz = false

# Sin lagos no se genera agua; el nivel del mar queda muy por debajo del
# suelo para que ninguna variante "_ocean"/"_beach" toque la superficie.
water_level = -1

# Bioma unico: con scale = 0 el ruido de calor/humedad es CONSTANTE en todo
# el mundo, asi que siempre gana el bioma mas cercano al punto (58, 39) =
# "Plains" (pasto + tierra + roca). Sin esto saldrian parches de desierto,
# nieve, hongos, etc. Los ruidos "_blend" tambien van en 0 porque suman
# +-1.5 y podrian saltar a un bioma vecino.
# Formato: offset, scale, (spread), seed, octaves, persistence, lacunarity
mg_biome_np_heat           = 58, 0, (1000, 1000, 1000), 5349, 3, 0.5, 2.0
mg_biome_np_humidity       = 39, 0, (1000, 1000, 1000), 842, 3, 0.5, 2.0
mg_biome_np_heat_blend     = 0, 0, (8, 8, 8), 13, 2, 1.0, 2.0
mg_biome_np_humidity_blend = 0, 0, (8, 8, 8), 90003, 2, 1.0, 2.0

# NOTA sobre el backend: el antiguo mundo CTF usaba `backend = dummy` (no
# escribia el mapa a disco). Aca NO lo usamos — la gracia es construir y que
# quede guardado. El backend se define en world.mt, no aca.
#
# ⚠️ EL world.mt HAY QUE CREARLO A MANO ANTES DEL PRIMER ARRANQUE.
# Verificado 2026-09-13: con el directorio del mundo vacio, Luanti 5.17 loguea
# "World 'plano' not available. Available worlds:" y arranca en el mundo por
# defecto (/config/.minetest/worlds/world) IGNORANDO el bind mount, aunque
# CLI_ARGS traiga --worldname plano --gameid mineclonia. Contenido minimo:
#   gameid = mineclonia
#   backend = sqlite3
#   player_backend = sqlite3
#   auth_backend = sqlite3
#   world_name = plano
# Ver docs/04-PLANO-30003/index.md (paso 4 del deploy).

# Spawn — 2 nodos sobre la superficie (suelo en y = 8)
static_spawnpoint = 0,10,0
respawn_auto = true

# ===========================================
# SEGURIDAD
# ===========================================
secure.enable_security = true
secure.trusted_mods =
disallow_empty_password = false
disable_escape_sequences = true

# Chat
default_language = es
chat_message_format = <@name> @message
chat_message_max_size = 500

# ===========================================
# PRIVILEGIOS DE NUEVOS JUGADORES
# ===========================================
# Mineclonia NO es VoxeLibre: el "trap" de default_privs que obliga a usar
# wetlands_newplayer en Wetlands no aplica aca (ver AGENTS.md).
default_privs = interact,shout,teleport,fly,fast

# ===========================================
# RENDIMIENTO
# ===========================================
dedicated_server_step = 0.09
active_object_send_range_blocks = 4
active_block_range = 3
max_block_send_distance = 12
max_block_generate_distance = 10
time_speed = 72
num_emerge_threads = 2
server_unload_unused_data_timeout = 600
server_map_save_interval = 60

# Anti-grief basico
max_objects_per_block = 256
max_forceloaded_blocks = 16

# ===========================================
# MOBS — desactivados (mundo de construccion)
# ===========================================
mobs_spawn = false
only_peaceful_mobs = true

# ===========================================
# MENSAJES
# ===========================================
kick_msg_crash_msgqueue = "Error de conexion - reconectate en un momento"
kick_msg_shutdown = "El mundo Plano esta en mantenimiento - vuelve pronto"

# ===========================================
# LOGS
# ===========================================
debug_log_level = warning
log_level = warning

# ===========================================
# ADMINISTRACION
# ===========================================
name = gabo
admin_name = gabo
admin_privs = server,privs,ban,kick,teleport,give,settime,worldedit,fly,fast,noclip,debug,password
