# ===========================================
# CONFIGURACIÓN SERVIDOR WETLANDS 🌱
# ===========================================

# Información básica del servidor
server_name = Wetlands 🌱 | Servidor Compassivo en Supervivencia
server_description = Servidor compassivo y plant-based en Luanti. Construimos un mundo basado en plantas, sin items de origen animal. Supervivencia educativa, apta para niños 7+.
server_address = luanti.gabrielpantoja.cl
server_url = https://gabrielpantoja.cl
world_name = original
worldname = original

# Configuración para aparecer en lista pública de servidores
server_announce = false
server_up_time = 24/7

# Tags para categorización en lista pública
server_keywords = survival,compassionate,spanish,kids,educational,family-friendly,no-pvp,plant-based,vegan

# Configuración de red
bind_address = 0.0.0.0
port = 30000
max_users = 20
default_privs = interact,shout,teleport
strict_protocol_version_checking = false

# Configuración del juego - MODO SUPERVIVENCIA (sin creepers, con PvP deshabilitado)
creative_mode = false
enable_damage = true
enable_pvp = false
enable_fire = true
enable_tnt = true
enable_rollback_recording = true
keepInventory = false

# Sin items iniciales en supervivencia (los jugadores recogen y craftean)
player_transfer_distance = 0
item_entity_ttl = 0

# VoxeLibre: Modo supervivencia nativo
mcl_enable_creative_mode = false
mcl_creative_is_survival_like = true
give_initial_stuff = false
initial_stuff =

# Protección y moderación
disallow_empty_password = false
secure.enable_security = true
secure.trusted_mods = animal_sanctuary,vegan_food,education_blocks,areas,vegan_replacements,home_teleport
disable_escape_sequences = true

# Chat y comunicación (en español)
default_language = es
chat_message_format = <@name> @message
chat_message_max_size = 500
chatcommands_msg_collaboration = false

# Rendimiento optimizado para modo creativo
dedicated_server_step = 0.09
active_object_send_range_blocks = 4
active_block_range = 3                    # Modernizado 2026-06-07 (al aplicar la conf por 1a vez)
max_block_send_distance = 14              # Modernizado: mejor distancia de vision (antes 8, default 12)
max_block_generate_distance = 10          # Optimizar generación
time_speed = 72
num_emerge_threads = 2                    # Multi-thread para generación
server_unload_unused_data_timeout = 600   # 10 min cache para creatividad

# Configuración del mundo
default_game = mineclone2
mg_name = v7
mg_flags = caves,light,decorations,biomes
enable_mapgen_debug_info = false
fixed_map_seed = 12345678901234567890

# ===============================================
# CONFIGURACIÓN DE MOBS - HOSTILES HABILITADOS (excepto Creeper)
# ===============================================
# Mobs hostiles spawnean de noche. Creeper bloqueado por mod wetlands_no_creeper.

mobs_spawn = true
only_peaceful_mobs = false
mcl_mob_cap_monster = 70
mcl_mob_cap_hostile = 300
mcl_mob_cap_animal = 10
mcl_mob_cap_ambient = 15
mcl_mob_cap_water = 8
mcl_mob_cap_water_ambient = 20
mcl_mob_cap_non_hostile = 300
mcl_mob_cap_total = 500
mob_spawners_in_dungeons = true
mg_dungeons = true
mobs_griefing = false
mobs_spawn_protected = false

# Mods y contenido
load_mod_animal_sanctuary = false
load_mod_vegan_foods = false
load_mod_vegan_food = false
load_mod_education_blocks = false
load_mod_protector = false

# ===========================================
# KILL-SWITCHES DE SUPERVIVENCIA
# ===========================================
# Mods de supervivencia que no aportan en un mundo sin fly/noclip/creative.
# ===========================================

load_mod_vegan_replacements = false
load_mod_home_teleport = false
load_mod_sethome = false
load_mod_mcl_back_to_spawn = false
load_mod_creative_force = false  # DESHABILITADO - Servidor ahora en supervivencia
load_mod_server_rules = true
load_mod_wetlands_mundos = true
load_mod_mcl_decor = false  # Supervivencia: sin decoración extra
load_mod_area_protection = false
load_mod_voxelibre_protection = false

# 2026-07-31: arena PvP deshabilitada en supervivencia dura. enable_pvp=false
# ya estaba en este archivo; ahora ademas apagamos pvp_arena para que no haya
# zona opt-in de combate. El mundo pasa a ser supervivencia pura (mobs
# hostiles de noche, sin PvP, sin arena).
load_mod_pvp_arena = false

# Mods de transporte sostenible - DESHABILITADOS (incompatibles con VoxeLibre)
load_mod_motorboat = false
load_mod_biofuel = false
load_mod_mobkit = false

# === AUTOMOBILES PACK (VoxeLibre Adapted) - Nov 15, 2025 ===
# Sustainable transport vehicles with plant-based fuel
load_mod_automobiles_lib = true
load_mod_automobiles_vespa = true
load_mod_automobiles_beetle = true
load_mod_automobiles_motorcycle = true
load_mod_automobiles_trans_am = false
load_mod_automobiles_roadster = false
load_mod_automobiles_coupe = false
load_mod_automobiles_buggy = true
load_mod_automobiles_catrelle = false
load_mod_automobiles_delorean = false

# Mods de eventos especiales - Halloween 🎃 (deshabilitados en supervivencia)
load_mod_halloween_ghost = false
load_mod_broom_racing = false
load_mod_halloween_zombies = false

# Mods de decoración y muebles (deshabilitados en supervivencia)
load_mod_3dforniture = false  # Decoración masiva no aporta en supervivencia dura
load_mod_mypark = false  # Juegos de plaza: columpios, resbalín, arenero, fuente, banca (DonBatman, MIT/CC0)

# Obsoleto: el bug de invisibilidad ya está corregido en VoxeLibre 0.92.0
# (make_invisible valida luaentity). El hotfix sólo rompía las pociones y
# gastaba CPU con un globalstep por tick. Desactivado 2026-06-27.
load_mod_mcl_potions_hotfix = false

# Configuración de spawn
static_spawnpoint = 655.1,18.5,243.9
respawn_auto = true

# Anti-grief básico
max_objects_per_block = 256
max_forceloaded_blocks = 16

# ===============================================
# CONFIGURACIÓN ESPECIAL PARA NIÑOS 👶🛡️
# ===============================================

# Restricciones de seguridad para menores
enable_client_modding = false              # Sin mods del cliente
csm_restriction_flags = 63                 # Máximas restricciones
csm_restriction_noderange = 0              # Sin acceso a nodos

# Protección automática y timeouts seguros
max_simultaneous_block_sends_per_client = 40    # Modernizado: menos pop-in (default; antes 6)
max_simultaneous_block_sends_server_total = 40  # Límite servidor
client_unload_unused_data_timeout = 300         # 5 min cliente
server_map_save_interval = 60                   # Guardar cada minuto

# Configuración de chat segura para niños
chat_message_count_per_player_per_5min = 100    # Anti-spam suave
kick_msg_crash_msgqueue = "Error de conexión - reconéctate en un momento"
kick_msg_shutdown = "Servidor en mantenimiento - vuelve pronto 🌱"

# Mensajes automáticos del servidor con reglas
server_chatcommands = true

# Mensajes de reglas que aparecen periódicamente
# MOTD minimalista al conectar (2026-07-30). Toda la info detallada esta en /reglas.
motd = Bienvenido al mundo original de pepelomo y gabo. Supervivencia: recolecta, construye y sobrevive sin creepers.

# Configuración de log
debug_log_level = warning
log_level = warning

# Administrador del servidor
name = gabo

# Privilegios completos para el administrador
# El usuario con name = gabo obtiene automáticamente todos los privilegios
# Privilegios adicionales para asegurar acceso completo
admin_name = gabo
admin_privs = server,privs,ban,kick,teleport,give,settime,worldedit,fly,fast,noclip,debug,password,rollback_check
# Elevator System - Realistic elevator mod with doors, sounds, and control systems
load_mod_celevator = false

# Chess Mod - Tablero de ajedrez real para jugar con amigos
load_mod_chess = false
load_mod_auto_road_builder = false
# === SISTEMA DE SKINS PERSONALIZADOS - Dec 7, 2025 ===
# Permite agregar skins customizados desde la carpeta del mundo
load_mod__world_folder_media = true
load_mod_mcl_custom_world_skins = true

# Wetlands custom mods (NPCs, música y navidad deshabilitados en supervivencia)
load_mod_wetlands_npcs = false
load_mod_wetlands_newplayer = true
load_mod_wetlands_music = false
load_mod_wetlands_christmas = false
load_mod_wetlands_no_creeper = true
load_mod_wetlands_supreme_zombie = false

# === CTF GUNS (Nate's CTF Guns modpack) — DESHABILITADO en Wetlands ===
# Source: https://github.com/natelastname/ctf_guns (GPL-3.0)
# Estos mods SOLO se cargan en el mundo CTF (puerto 30003).
# En Wetlands (30000, mundo familiar 7+) las armas estan apagadas para preservar
# el caracter compasivo. Tested OK 2026-04-25; smoke grenade fix aplicado.
# Para reactivar aqui: cambiar a `true` y agregar las lineas a world.mt en VPS.
load_mod_controls = false       # mt-mods/controls (MIT) — solo necesario para ctf_ranged
load_mod_ctf_core = false       # CTF utility core
load_mod_rawf = false           # bullet/ammo entity API
load_mod_grenades = false       # throwable grenades
load_mod_ctf_ranged = false     # 18 firearms + 3 energy weapons
load_mod_darkness_nerf = false  # KILL-SWITCH: needs `default`, never enable in VoxeLibre
