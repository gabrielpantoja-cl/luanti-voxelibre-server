# ===========================================
# CONFIGURACION SERVIDOR MINECLONIA 🎮
# ===========================================
# Quinto mundo: Mineclonia (https://codeberg.org/mineclonia/mineclonia)
# Game independiente de Luanti — fork fiel a Minecraft, NO es VoxeLibre.
# Instalacion: clonar el repo Codeberg dentro de server/games/mineclonia/
# y borrar el .git/ (ver docs/05-MINECLONIA-30004/install.md).
# El mapeo a puerto 30004 del host se define en docker-compose.yml.
#
# Experiencia buscada: la mas fiel al Minecraft vanilla. Sin mods custom
# de Wetlands — solo el game base Mineclonia. Modo creativo, sin dano,
# inventario creativo disponible desde el primer join.

# Informacion basica del servidor
server_name = Mineclonia 🎮 | Minecraft Fiel en Luanti
server_description = Mineclonia 0.123.0 — fork de VoxeLibre inspirado en Minecraft. Modo creativo, mundo generado desde la semilla "apple". Construye, explora y experimenta la esencia del Minecraft vanilla en Luanti.
motd = Bienvenid@ a Mineclonia! Modo creativo sin dano. Toma cualquier item del inventario creativo y construye lo que imagines.
server_address = luanti.gabrielpantoja.cl
server_url = https://gabrielpantoja.cl
world_name = mineclonia
worldname = mineclonia

# Anunciar en lista publica — desactivado por ahora. Se reactiva cuando
# confirmemos que la duplicacion de puerto 30000 (interno) no genera
# entradas falsas en servers.luanti.org junto con Wetlands.
server_announce = false
server_keywords = creative,voxel-built,mineclonia,minecraft,sandbox,spanish

# Configuracion de red — el container escucha en 30000 internamente, el
# mapeo a 30004 del host se hace en docker-compose.yml.
bind_address = 0.0.0.0
port = 30000
max_users = 15
strict_protocol_version_checking = false

# ===========================================
# MODO CREATIVO SIN DAÑO
# ===========================================
# El usuario quiere la experiencia creativa mas fiel: dano desactivado,
# inventario creativo disponible desde el menu.
#
# NOTA: "give_initial_stuff" en Minetest NO rellena el inventario — solo
# da el kit inicial de spawn. En creativo el jugador usa el menu
# creativo (search bar) para tomar cualquier item. Por eso NO necesitamos
# give_initial_stuff aqui; el menu creativo ya da acceso total.
creative_mode = true
enable_damage = false
enable_pvp = false
enable_fire = false
enable_tnt = false
enable_rollback_recording = false
keepInventory = true

# Mapgen seed — "mineclonia" produce un mundo unico
fixed_map_seed = mineclonia

# Game base
default_game = mineclonia
load_mod_wetlands_mundos = true

# Mapgen custom de Mineclonia (Lua mapgen compatible con seeds de Minecraft).
# Mineclonia registra su mapgen custom con el nombre "singlenode" — el mod
# `mcl_levelgen` intercepta singlenode y aplica su propia logica de
# generacion de terreno Minecraft-fiel. NO es el singlenode generico de
# Luanti (que solo coloca un nodo en todo el mundo).
#
# Si se omite mg_name, Luanti 5.16 usa el mapgen v7 generico de Minetest,
# NO el de Minecraft. Ver README.txt en mods/MAPGEN/mcl_levelgen/ del
# game base para detalles.
#
# NOTA: "mcl_levelgen" como valor de mg_name NO funciona — da
# "EmergeManager: mapgen 'mcl_levelgen' not valid; falling back to v7".
# El nombre correcto es "singlenode" (interceptado por el mod).
mg_name = singlenode

# Spawn
# 2026-08-01: el spawn (0,15,0) cayo en el agua. gabo lo bajo a
# (-14, 4.5, 240) — zona mas alta con terreno visible. Y=4.5 no es
# tipico (medio-bloque) pero el punto esta justo sobre una colina.
static_spawnpoint = -14,4.5,240
respawn_auto = true

# ===========================================
# SEGURIDAD — defaults de Mineclonia (mas permisivos que VoxeLibre)
# ===========================================
# Mineclonia usa enable_client_modding=true y csm_restriction_flags=0
# por design (es un game "fiel a Minecraft", no una version endurecida
# para ninos). Se mantienen los defaults del game base. Si queres
# endurecer, mover a default_privs mas restrictivos.
secure.enable_security = true
secure.trusted_mods =
disallow_empty_password = false
disable_escape_sequences = true

# Chat
default_language = es
chat_message_format = <@name> @message
chat_message_max_size = 500

# ===========================================
# PRIVILEGIOS DE NUEVOS JUGADORES
# ===========================================
# Mineclonia NO es VoxeLibre — el mod wetlands_newplayer no se carga
# (el usuario no quiere mods custom), y el "trap" de default_privs que
# tiene VoxeLibre NO aplica aqui. Por eso default_privs funciona
# directamente. Si un dia se observa que no se otorgan, agregar un mod
# minimo tipo "wetlands_mineclonia_newplayer" en server/mods/.
default_privs = interact,shout,teleport

# ===========================================
# RENDIMIENTO
# ===========================================
dedicated_server_step = 0.09
active_object_send_range_blocks = 4
active_block_range = 3
max_block_send_distance = 12
max_block_generate_distance = 10
time_speed = 72
num_emerge_threads = 2
server_unload_unused_data_timeout = 600

# Anti-grief basico
max_objects_per_block = 256
max_forceloaded_blocks = 16

# ===========================================
# MOBS — creativos sin spawn agresivo
# ===========================================
# En creativo los mobs no son prioridad. Desactivado para evitar mobs
# que rompan builds en mundos compartidos. Reactivar solo_peaceful_mobs
# si se quiere ambientacion.
mobs_spawn = false
only_peaceful_mobs = true

# ===========================================
# MENSAJES
# ===========================================
kick_msg_crash_msgqueue = "Error de conexion - reconectate en un momento"
kick_msg_shutdown = "Mineclonia en mantenimiento - vuelve pronto"

# ===========================================
# LOGS
# ===========================================
debug_log_level = warning
log_level = warning

# ===========================================
# ADMINISTRACION
# ===========================================
name = gabo
admin_name = gabo
admin_privs = server,privs,ban,kick,teleport,give,settime,worldedit,fly,fast,noclip,debug,password

# ===========================================
# MODS — SET MINIMO / CERO
# ===========================================
# El usuario pidio "solo el game base de mineclonia, sin mods".
# Los mods de Wetlands (server/mods/wetlands_*) NO se cargan en este
# mundo por defecto, salvo `wetlands_mineclonia_trampas` (bloque
# "trampa amistosa" agregado 2026-08-03 a pedido del admin para
# construir regalos sorpresas en Mineclonia, sin daño).
# Si en el futuro se agrega WorldEdit u otro mod, listarlo aca con
# load_mod_<nombre> = true (Y en world.mt en el VPS — ver AGENTS.md
# "Configuration Hierarchy").
# ===========================================

# Excepción intencional: trampa amistosa (sin daño, creativo).
# Solo agrega un bloque "stone-like" que al pisarlo muestra un
# mensaje en chat + corazones. Compatible con creative sin daño.
load_mod_wetlands_mineclonia_trampas = true

# Sin más mods custom: no se carga nada de server/mods/, solo el game base.
# (Si --gameid mineclonia se especifica, Luanti ignora mods no listados
# en world.mt — pero por defecto solo los mods en games/mineclonia/
# mods/ del propio game estan disponibles, no los de server/mods/.)
